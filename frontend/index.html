<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PayFlow — POS & Inventory</title>
    <script>
      // 🎨 თემის (Dark/Light) ადრეული რეზოლუცია — React-ის mount-მდე,
      // რომ არ იყოს "ციმციმი" (Flash of Unstyled/Wrong Theme).
      (function () {
        try {
          var STORAGE_KEY = 'payflow_theme';
          var saved = localStorage.getItem(STORAGE_KEY);
          var theme;
          if (saved === 'dark' || saved === 'light') {
            theme = saved;
          } else {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = prefersDark ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          // localStorage/matchMedia მიუწვდომელია — ვრჩებით ნაგულისხმევ (light) თემაზე
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>

  </body>
</html>
